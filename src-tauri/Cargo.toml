[package]
name = "laf-agent"
version = "0.1.0"
edition = "2021"

[lib]
name = "laf_agent_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "laf-agent"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "devtools", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "io-util", "time", "process"] }
libc = "0.2"
base64 = "0.22"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.8"
log = "0.4"
open = "5"
ignore = "0.4"
tauri-plugin-log = "2"
git2 = { version = "0.20", default-features = false }
thiserror = "2"
which = "7"
confy = "0.6"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"
parking_lot = "0.12"
redb = "2.4"
imagesize = "0.13"
notify = "7"
notify-debouncer-mini = "0.5"
glob = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
# ── Performance crates (inspired by Zed) ───────────────────────────────────
# Fuzzy matching for pickers (fzf-style scoring, same family Helix/Zed use)
nucleo-matcher = "0.3"
# Fast diff algorithm — Myers/Histogram, faster than `similar` on large inputs
imara-diff = "0.1"
# GFM markdown parser, parses to a flat event stream
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
# Syntax highlighting (TextMate/Sublime grammars; no WASM, no JS)
# Fast cryptographic hash for cache keys

# confy stores settings as TOML; we parse the file ourselves before confy
# loads it, so an unparseable config can be quarantined instead of silently
# replaced by defaults.
toml = "0.8"
# Bounded line framing for the agent's stdout (LinesCodec with a max length).
tokio-util = { version = "0.7", features = ["codec"] }
# StreamExt for FramedRead; already in the tree transitively via reqwest.
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.dev]
incremental = true

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = 2
panic = "abort"

[profile.dev.package."*"]
opt-level = 2


[target.'cfg(target_os = "macos")'.dependencies]
# Maintained AppKit bindings (the deprecated `cocoa`/`objc` pair was the source
# of every remaining Rust warning). Versions match what tauri itself pulls.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication", "NSResponder", "NSWindow", "NSView", "NSButton",
    "NSControl", "NSImage", "NSRunningApplication", "objc2-quartz-core",
] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSGeometry"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer"] }
