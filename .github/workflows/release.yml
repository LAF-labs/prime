name: Release

# Builds, signs, and notarizes a macOS DMG, then publishes it as a draft
# release. Triggered by pushing a v* tag, or manually.
#
# Required repository secrets (all of them, or the signing step fails):
#   APPLE_CERTIFICATE          base64 of a Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD password for that .p12
#   APPLE_SIGNING_IDENTITY     e.g. "Developer ID Application: LAF (TEAMID)"
#   APPLE_ID                   Apple ID used for notarization
#   APPLE_PASSWORD             app-specific password for that Apple ID
#   APPLE_TEAM_ID              10-character team id
# Required for auto-update (the updater refuses unsigned manifests):
#   TAURI_SIGNING_PRIVATE_KEY          contents of the minisign private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD its password, or "" if it has none
#
# The release is created as a draft. `releases/latest/download/latest.json`
# only serves *published* releases, so no user is offered the update until
# the draft is published — which is the intended gate, not an oversight.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  macos:
    # Apple Silicon runner: the sidecar ships arm64 native modules.
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The sidecar bundles this exact Node binary, so the runner's version
      # is what users get.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the prime-agent sidecar
        run: bash scripts/build-sidecar.sh

      - name: Typecheck and test
        run: |
          bunx tsc --noEmit
          bun run test:ui
          cargo test --lib --manifest-path src-tauri/Cargo.toml

      # Apple signing is optional until the maintainer registers a Developer ID:
      # passing empty-string env vars would make the bundler try to import an
      # empty certificate, so the variables are only exported when the secret
      # actually exists. An unsigned draft is a rehearsal artifact, not a
      # shippable one — Gatekeeper will (correctly) warn on it.
      - name: Export Apple signing env when configured
        run: |
          if [ -n "${{ secrets.APPLE_CERTIFICATE }}" ]; then
            {
              echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}"
              echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
              echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
              echo "APPLE_ID=${{ secrets.APPLE_ID }}"
              echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
              echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
              echo "APPLE_SIGNING=1"
            } >> "$GITHUB_ENV"
          else
            echo "No Apple signing secrets — building an unsigned rehearsal draft."
          fi

      - name: Build, sign updater artifacts, and publish draft
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The updater signature is not optional: the app refuses unsigned
          # manifests, so a draft without it could never be offered to anyone.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LAF Agent ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: --target aarch64-apple-darwin

      # Signing the .app is not enough: the bundled Node, uv, and every
      # native .node module are separate Mach-O binaries that Gatekeeper
      # checks individually. tauri-action signs the outer bundle, so verify
      # the whole tree rather than discovering the gap on a user's machine.
      - name: Verify the signature covers the bundled runtime
        if: env.APPLE_SIGNING == '1'
        run: |
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/LAF Agent.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl -a -vv "$APP"
