<!doctype html>
<html lang="en" class="dark" style="height:100%;overflow:hidden">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>LAF Agent</title>
        <!-- Prefetch terminal WASM so it's in the HTTP cache before the user opens a terminal -->
        <link rel="prefetch" href="/ghostty-vt.wasm" as="fetch" crossorigin />
        <script>
            // Apply theme before first paint to prevent flash
            (function(){
                var t='dark';try{t=localStorage.getItem('laf-agent-theme')||'dark'}catch(e){}
                if(t==='system'){t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'}
                if(t==='dark'){document.documentElement.classList.add('dark')}else{document.documentElement.classList.remove('dark')}
            })();
        </script>
    </head>
    <body>
        <div id="splash" style="
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.4s ease;
            pointer-events: none;
        ">
            <span id="splash-wordmark" style="
                font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
                font-size: 28px;
                font-weight: 600;
                letter-spacing: 0.01em;
                user-select: none;
                animation: splash-pulse 1.8s ease-in-out infinite alternate;
            ">LAF Agent</span>
            <style>
                #splash { background: #fafafa; }
                #splash-wordmark { color: #6e6e6e; }
                .dark #splash { background: #262626; }
                .dark #splash-wordmark { color: #a1a1a1; }
                @keyframes splash-pulse {
                    from { opacity: 0.55; }
                    to   { opacity: 1; }
                }
            </style>
        </div>
        <div id="root"></div>
        <div id="crash-fallback" style="
            display: none;
            position: fixed;
            inset: 0;
            z-index: 10000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 24px;
            text-align: center;
            font-family: system-ui, sans-serif;
            color: #ececec;
            background: #262626;
        ">
            <button id="crash-close" aria-label="Close" style="
                position: absolute; top: 16px; right: 16px;
                width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
                border-radius: 8px; border: 1px solid #333; background: transparent;
                color: #888; font-size: 18px; cursor: pointer; line-height: 1;
            ">✕</button>
            <div style="font-size: 32px">⚠️</div>
            <h2 style="font-size: 16px; font-weight: 600; margin: 0">LAF Agent failed to load</h2>
            <p style="font-size: 13px; color: #888; max-width: 360px; margin: 0; line-height: 1.5">
                The app could not start. Try reloading, or reset app data if the problem persists.
            </p>
            <div style="display: flex; gap: 8px; margin-top: 8px">
                <button id="crash-reload" style="
                    padding: 8px 16px; font-size: 13px; font-weight: 500; border-radius: 8px;
                    border: 1px solid #333; background: transparent; color: #ccc; cursor: pointer;
                ">Reload</button>
            </div>
        </div>
        <script type="module" src="/src/renderer/main.tsx"></script>
        <script>
            // If React hasn't mounted within 10s, show the crash fallback
            window.__crashTimer = setTimeout(function() {
                var root = document.getElementById('root');
                if (root && root.childElementCount === 0) {
                    var splash = document.getElementById('splash');
                    if (splash) splash.style.display = 'none';
                    var fb = document.getElementById('crash-fallback');
                    if (fb) fb.style.display = 'flex';
                }
            }, 10000);
            document.addEventListener('click', function(e) {
                if (e.target && e.target.id === 'crash-reload') {
                    window.location.reload();
                }
                if (e.target && e.target.id === 'crash-close') {
                    var fb = document.getElementById('crash-fallback');
                    if (fb) fb.style.display = 'none';
                }
            });
        </script>
    </body>
</html>
